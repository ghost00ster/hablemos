<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FFF8EE">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Hablemos">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Hablemos · Terapeuta interactivo de lenguaje</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#26283B; --muted:#6B6E85; --line:#E8E1D4;
  --accent:#2F6FEB; --accent-2:#E8F0FF; --ok:#17A589; --warn:#E85D4A;
  --p:#FFE066; --v:#9BE09B; --n:#FFBE85; --a:#9CCBFF; --s:#FFA8CB; --q:#CDB4FF; --x:#E4E4E4;
  --tile-min:140px; --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,.tile,.chip,.step,.cat,nav.tabs button{touch-action:manipulation;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(0,0,0,.08)}.cat:hover,.btn:hover,.sbtn:hover{filter:brightness(.96)}nav.tabs button:hover{background:#F5F1EA}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
html,body{margin:0;height:100%}
body{font-family:Nunito,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);
  padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left);
  display:flex;flex-direction:column;min-height:100vh;min-height:100dvh;overscroll-behavior-y:none}
button{font-family:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}
.hidden{display:none!important}

/* header */
header{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;background:var(--card);border-bottom:2px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:900;font-size:20px;letter-spacing:-.3px;display:flex;align-items:center;gap:8px}
.brand .dot{width:30px;height:30px;border-radius:10px;background:linear-gradient(135deg,#FFB570,#FF8FB8);display:grid;place-items:center;font-size:17px}
.who{margin-left:auto;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;color:var(--muted)}
.who b{color:var(--ink)}
.fsbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;width:42px;height:42px;font-size:18px}
.lockbtn{border:2px solid var(--line);background:var(--card);border-radius:14px;width:42px;height:42px;font-size:20px;position:relative;overflow:hidden}
.lockbtn .ring{position:absolute;inset:0;background:var(--accent-2);transform:scaleX(0);transform-origin:left;transition:none}
.lockbtn span{position:relative}

main{flex:1;padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:1500px;width:100%;margin:0 auto}

/* bottom nav */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;gap:4px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav.tabs button{flex:1;max-width:160px;border:0;background:none;border-radius:14px;padding:6px 4px;font-weight:800;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:24px;line-height:1}
nav.tabs button.on{background:var(--accent-2);color:var(--accent)}

/* sentence strip */
.strip{display:flex;gap:8px;align-items:stretch;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:8px;margin-bottom:12px;position:sticky;top:var(--hdr,66px);z-index:4}
.strip .words{flex:1;display:flex;gap:6px;overflow-x:auto;min-height:84px;align-items:center;padding:2px}
.strip .ph{color:var(--muted);font-weight:700;padding:0 8px;font-size:15px}
.chip{flex:0 0 auto;width:72px;height:80px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid rgba(0,0,0,.08);background:#fff;font-weight:800;font-size:12px;animation:pop .2s ease}
.chip .pic{font-size:34px;line-height:1.1}
.chip img{width:50px;height:50px;object-fit:cover;border-radius:8px}
.chip.speaking{outline:4px solid var(--accent);outline-offset:1px}
.sbtn{border:0;border-radius:16px;font-weight:900;font-size:15px;padding:0 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:64px}
.sbtn .ic{font-size:26px}
.sbtn.speak{background:var(--accent);color:#fff;min-width:88px}
.sbtn.del{background:#F1ECE3}

/* core row + categories */
.core{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin-bottom:10px;padding:8px;border-radius:var(--radius);background:#F3EEE5}
.cats{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:2px}
.cat{flex:0 0 auto;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:800;font-size:15px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.cat .e{font-size:20px}
.cat.on{border-color:var(--accent);background:var(--accent-2);color:var(--accent)}

/* tiles */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--tile-min),1fr));gap:clamp(6px,1.2vw,14px)}
.tile{aspect-ratio:1/1.05;max-width:calc(var(--tile-min) * 1.6);width:100%;justify-self:center;border-radius:var(--radius);border:3px solid rgba(0,0,0,.08);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;font-weight:900;font-size:clamp(14px,calc(var(--tile-min) * .12),22px);box-shadow:0 3px 0 rgba(0,0,0,.08);transition:transform .08s;user-select:none;-webkit-user-select:none;text-align:center;line-height:1.1}
.tile:active{transform:scale(.95)}
.tile .pic{font-size:calc(var(--tile-min) * .46);line-height:1}
.tile img{width:62%;aspect-ratio:1;object-fit:cover;border-radius:12px}
.tile img.ar,.chip img.ar,.step img.ar,.bigpic img.ar{object-fit:contain;border-radius:0}
.tile img.ar{width:74%;max-height:72%}
.tile .pic.txt,.chip .pic.txt,.step .pic.txt{font-size:calc(var(--tile-min) * .3);font-weight:900;color:#444;line-height:1.2}
.bigpic .pic{font-size:inherit}.bigpic .pic.txt{font-size:72px}
.chip .pic.txt{font-size:22px}
.step .pic.txt{font-size:40px}
.tile .lbl{display:block}
.core .tile{aspect-ratio:auto;padding:6px 4px;font-size:13px;gap:2px}
.core .tile .pic{font-size:34px}
.core .tile img{width:46px;height:46px}
.tile.flash{animation:flash .5s ease}
.fitz .t-p{background:#FFF4C2;border-color:var(--p)}
.fitz .t-v{background:#DDF5DD;border-color:var(--v)}
.fitz .t-n{background:#FFE6CF;border-color:var(--n)}
.fitz .t-a{background:#DDEEFF;border-color:var(--a)}
.fitz .t-s{background:#FFE0EC;border-color:var(--s)}
.fitz .t-q{background:#ECE3FF;border-color:var(--q)}
.fitz .t-x{background:#F2F2F2;border-color:var(--x)}
.upper .tile .lbl,.upper .chip .lbl,.upper .bigword{text-transform:uppercase}

body.low{--bg:#F6F6F4}
body.low .tile{box-shadow:none}
body.low.fitzwrap .tile{background:#fff}
body.low *{animation:none!important;transition:none!important}
.low .fitz .tile{background:#fff}

@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(47,111,235,.6)}100%{box-shadow:0 0 0 18px rgba(47,111,235,0)}}

/* panels */
.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.panel h2{margin:0 0 4px;font-size:20px;font-weight:900}
.panel h3{margin:14px 0 6px;font-size:16px;font-weight:900}
.panel p.sub{margin:0 0 12px;color:var(--muted);font-weight:700;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:150px;margin-bottom:10px}
.field label{font-weight:800;font-size:13px;color:var(--muted)}
.field input,.field select,.field textarea{border:2px solid var(--line);border-radius:12px;padding:10px;background:#fff;color:var(--ink)}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:900;font-size:15px;background:var(--accent);color:#fff}
.btn.ghost{background:#F1ECE3;color:var(--ink)}
.btn.danger{background:#FDE7E3;color:var(--warn)}
.btn.ok{background:var(--ok)}
.btn.small{padding:7px 11px;font-size:13px;border-radius:11px}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px;font-weight:800;font-size:14px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;flex:0 0 auto;accent-color:var(--accent)}
.check.on{border-color:var(--accent);background:var(--accent-2)}
.levels{display:grid;gap:8px}
.lvl{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;text-align:left;background:#fff}
.lvl.on{border-color:var(--accent);background:var(--accent-2)}
.lvl .n{flex:0 0 32px;height:32px;border-radius:10px;background:#F1ECE3;display:grid;place-items:center;font-weight:900}
.lvl.on .n{background:var(--accent);color:#fff}
.lvl b{display:block;font-size:15px}
.lvl small{color:var(--muted);font-weight:700;font-size:13px}
.tips{background:#FFF3D6;border-radius:14px;padding:12px 14px;font-weight:700;font-size:14px;line-height:1.45}
.tips li{margin-bottom:6px}
.note{font-size:12.5px;color:var(--muted);font-weight:700;margin-top:10px}

/* editor */
details.grp{border:2px solid var(--line);border-radius:14px;margin-bottom:8px;background:#fff}
details.grp summary{padding:10px 12px;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary .cnt{margin-left:auto;font-size:13px;color:var(--muted)}
.wchips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 12px}
.wchip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;opacity:.55}
.wchip.on{opacity:1;border-color:var(--ok);background:#E5F7F3}
.wchip img{width:26px;height:26px;border-radius:5px;object-fit:contain;background:#fff}
.wchip .x{color:var(--warn);font-weight:900;margin-left:2px}

/* practice */
.prac{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.bigpic{width:min(300px,70vw);aspect-ratio:1;border-radius:32px;background:#fff;border:4px solid var(--line);display:grid;place-items:center;font-size:min(170px,40vw);line-height:1}
.bigpic img{width:84%;height:84%;object-fit:cover;border-radius:20px}
.bigword{font-size:clamp(36px,9vw,56px);font-weight:900;letter-spacing:.5px}
.syls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:54px}
.syl{font-size:clamp(24px,6vw,34px);font-weight:900;padding:4px 14px;border-radius:14px;background:#F1ECE3}
.syl.on{background:var(--accent);color:#fff;transform:scale(1.12)}
.syl.gap{background:none;padding:0 4px}
.pbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pbtns .btn{font-size:17px;padding:14px 18px}
.score{font-weight:800;color:var(--muted)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.burst span{position:absolute;font-size:34px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}

/* agenda */
.agenda{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;align-items:stretch}
.step{flex:0 0 150px;border-radius:var(--radius);background:#fff;border:3px solid var(--line);padding:10px;text-align:center;position:relative}
.step .ord{font-weight:900;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.step .pic{font-size:72px;line-height:1.15}
.step img{width:90px;height:90px;object-fit:cover;border-radius:14px}
.step .lbl{font-weight:900;font-size:18px}
.step.done{opacity:.35}
.step.done::after{content:"✓";position:absolute;top:6px;right:10px;font-size:30px;color:var(--ok);font-weight:900;opacity:1}
.step.now{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-2)}
.step .rm{position:absolute;top:4px;left:6px;border:0;background:none;font-size:16px;color:var(--warn)}
.arrow{align-self:center;font-size:30px;color:var(--muted);flex:0 0 auto}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;max-height:46vh;overflow:auto}
.picker .tile{font-size:12px}
.picker .tile .pic{font-size:36px}
.picker .tile img.ar{width:70%}

/* modal */
.modal{position:fixed;inset:0;background:rgba(30,30,50,.45);display:grid;place-items:center;z-index:30;padding:14px}
.modal .box{background:var(--bg);border-radius:24px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:800;z-index:60;font-size:14px}
table.st{width:100%;border-collapse:collapse;font-size:14px;font-weight:700}
table.st td,table.st th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:10px;background:#F1ECE3;border-radius:6px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;font-weight:800;margin-top:6px}
.legend span{padding:3px 8px;border-radius:8px;border:2px solid}
@media (max-width:560px){
  .sbtn{min-width:52px;padding:0 8px;font-size:12px}
  .sbtn.speak{min-width:66px}
  .chip{width:62px;height:72px}
  .chip .pic{font-size:28px}
  .brand .t{display:none}
}

/* ---- Computadoras y tablets horizontales: menú lateral ---- */
@media (min-width:900px) and (min-height:520px){
  nav.tabs{top:var(--hdr,62px);bottom:0;right:auto;width:96px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:2px solid var(--line);padding:12px 8px 12px calc(8px + env(safe-area-inset-left));gap:8px}
  nav.tabs button{flex:0 0 auto;padding:12px 4px;font-size:13px}
  nav.tabs button .ic{font-size:28px}
  header{padding-left:calc(14px + env(safe-area-inset-left))}
  main{padding:16px 20px 24px 116px;}
  .toast{bottom:28px}
  .panel{padding:20px 22px}
  #main .panel.prac{padding:24px}
}
@media (min-width:1300px){main{padding-left:130px}.checks{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}}
/* ---- Celulares: palabras núcleo en una sola fila deslizable ---- */
@media (max-width:640px),(max-height:520px) and (orientation:landscape){
  .core{display:flex;overflow-x:auto;gap:6px;padding:6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
  .core .tile{flex:0 0 78px;width:78px;max-width:none;aspect-ratio:auto;min-height:78px;scroll-snap-align:start}
  .core .tile img{width:40px;height:40px}
  .core .tile .lbl{font-size:11px}
}
/* ---- Celular horizontal / pantallas bajas ---- */
@media (max-height:520px) and (orientation:landscape){
  header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  .brand .dot{width:26px;height:26px}
  nav.tabs{padding-top:2px;padding-bottom:calc(2px + env(safe-area-inset-bottom))}
  nav.tabs button{flex-direction:row;gap:6px;font-size:12px}
  nav.tabs button .ic{font-size:20px}
  main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .strip{padding:4px;margin-bottom:6px}.strip .words{min-height:56px}.chip{height:54px;width:54px;font-size:10px}.chip img{width:30px;height:30px}.sbtn{min-width:56px;font-size:12px}
  .core{margin-bottom:6px}.cats{padding-bottom:6px}.cat{padding:5px 10px;font-size:13px}
  .sbtn .ic{font-size:20px}
  .prac{flex-direction:row;flex-wrap:wrap;justify-content:center}
  .bigpic{width:min(220px,40vh);}
  .toast{bottom:64px}
}
/* ---- Pantallas muy pequeñas ---- */
@media (max-width:360px){nav.tabs button{font-size:11px}.who span:last-child{display:none}}
@supports not (aspect-ratio:1/1){.tile{height:calc(var(--tile-min) * 1.05)}.core .tile{height:auto;min-height:84px}.bigpic{height:min(300px,70vw)}.tile img{height:62%}}
/* juegos */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.gcard{border:3px solid var(--line);background:#fff;border-radius:var(--radius);padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 0 rgba(0,0,0,.06)}
.gcard:disabled{opacity:.5}
.gcard .ge{font-size:46px}.gcard b{font-size:19px}.gcard small{color:var(--muted);font-weight:700;font-size:13.5px}
.gcard .area{color:var(--accent);text-transform:uppercase;letter-spacing:.4px;font-size:12px}
.gcard .gst{margin-top:6px;color:var(--ok)}
.gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:17px}
.gbar .score{margin-left:auto}
.dots{display:flex;gap:5px;margin-left:auto}.dots i{width:12px;height:12px;border-radius:50%;background:#E8E1D4}.dots i.d{background:var(--ok)}.dots i.c{background:var(--accent)}
.prompt{display:flex;align-items:center;gap:12px;justify-content:center;background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px;font-size:clamp(20px,4vw,28px);font-weight:900}
.prompt .btn{font-size:24px;padding:10px 16px}
.nolbl .tile .lbl{display:none}
.memo .tile .lbl{display:block}
.gopts{max-width:1000px;margin:0 auto;--tile-min:min(230px,40vw)}
.gopts.few{--tile-min:min(260px,42vw)}
.memo{--tile-min:min(170px,27vw)}
.tile.right{border-color:var(--ok)!important;box-shadow:0 0 0 5px rgba(23,165,137,.35)}
.tile.wrong{animation:shake .4s}
.tile.hint{animation:glow 1s ease-in-out infinite alternate}
.tile.back{background:linear-gradient(135deg,#FFB570,#FF8FB8);border-color:transparent}
.tile.back .pic{filter:grayscale(.2);opacity:.85}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes glow{from{box-shadow:0 0 0 0 rgba(47,111,235,.5)}to{box-shadow:0 0 0 10px rgba(47,111,235,.15)}}
/* informe */
.rhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.rtitle{font-size:13px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.6px}
.rname{font-size:28px;font-weight:900}
.rdate{text-align:right}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:var(--radius);padding:14px;text-align:center}
.kpi b{display:block;font-size:34px;line-height:1.1}.kpi span{font-size:13px;font-weight:800;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bv{width:100%;max-width:34px;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.bcol small{font-size:11px;font-weight:800;color:var(--muted)}
.rchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.rchip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:12px;padding:4px 10px 4px 4px;font-weight:800;font-size:14px;background:#fff}
.rchip img{width:30px;height:30px;object-fit:contain}.rchip small{color:var(--muted)}

function recommend(p){
  const c=p.conds||[];
  const gram=c.includes('tdl');
  return ALL().filter(w=>{
    if(p.age<w.amin||p.age>w.amax)return false;
    let lv=w.lvl;
    if(gram&&(w.c==='palabritas'||w.c==='preguntas'))lv-=1;
    if(w.custom)return true;
    return lv<=p.level;
  }).map(w=>w.id);
}
function presetSettings(p){
  const c=(p.conds||[]).map(k=>CONDS[k]).filter(Boolean);
  let rate=.9;c.forEach(x=>rate+=x.rate||0);
  return{
    rate:Math.max(.55,Math.round(rate*100)/100),
    fitz:p.level>=3||c.some(x=>x.fitz),
    low:c.some(x=>x.low),
    deb:c.some(x=>x.deb),
    big:c.reduce((m,x)=>Math.max(m,x.big||0),0),
    syl:c.some(x=>x.syl)||p.level<=2,
    upper:p.age<=7,
    sym:(p.settings&&p.settings.sym)||'arasaac',
    voz:(p.settings&&p.settings.voz)||'grabada',
    voice:(p.settings&&p.settings.voice)||''
  };
}
function newProfile(d){

  p.settings=presetSettings(p);p.enabled=recommend(p);p.vocabV=VOCAB_V;return p;
}

let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^es([-_]|$)/i.test(v.lang))}catch(e){voices=[]}}
setTimeout(loadVoices,400);setTimeout(loadVoices,1500);
try{loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(view==='ajustes')render()}}catch(e){}
function pickVoice(){
  const want=P()?.settings.voice;
  if(want){const v=voices.find(v=>v.voiceURI===want);if(v)return v}
  const pref=['es-MX','es-US','es-419','es-SV','es-GT','es-CO','es-AR','es-ES'];const L=v=>v.lang.replace('_','-').toLowerCase();
  for(const l of pref){const ll=l.toLowerCase();const v=voices.find(v=>L(v)===ll&&/google|natural|neural|online|paulina|mónica|monica|sabina|dalia|jorge|ximena/i.test(v.name))||voices.find(v=>L(v)===ll);if(v)return v}
  return voices[0]||null;
}
function speak(text,opt={}){
  return new Promise(res=>{
    try{
      if(!opt.queue)speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang='es-419';const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
      u.rate=(opt.rate||P()?.settings.rate||.9);u.pitch=opt.pitch||1.05;u.volume=1;
      u.onend=()=>res();u.onerror=()=>res();
      speechSynthesis.speak(u);try{if(speechSynthesis.paused)speechSynthesis.resume()}catch(_){}
      setTimeout(res,Math.max(1500,text.length*260/u.rate));
    }catch(e){toast('Este navegador no tiene voz disponible');res()}
  });
}

const AUD=window.HAB_AUDIO||{};
let actx=null;const bufCache={};let curSrc=null,curEl=null,playToken=0;
function unlockAudio(){try{if(!actx){const C=window.AudioContext||window.webkitAudioContext;if(C)actx=new C()}if(actx&&actx.state==='suspended')actx.resume()}catch(_){}}
function b64ToBuf(b){const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer}
function stopAll(){playToken++;try{curSrc&&curSrc.stop()}catch(_){}curSrc=null;try{if(curEl){curEl.pause();curEl=null}}catch(_){}try{speechSynthesis.cancel()}catch(_){}}
function decode(key,b64){
  if(bufCache[key])return bufCache[key];
  const raw=b64.startsWith('data:')?b64.split(',')[1]:b64;
  bufCache[key]=new Promise((res,rej)=>{try{const r=actx.decodeAudioData(b64ToBuf(raw),res,rej);if(r&&r.then)r.then(res,rej)}catch(e){rej(e)}});
  bufCache[key].catch(()=>{delete bufCache[key]});return bufCache[key];
}
async function playB64(key,b64,rate,tok){
  if(tok!==playToken)return;
  const pr=Math.min(1.2,Math.max(.75,rate||1));
  if(actx){
    try{
      if(actx.state==='suspended')await actx.resume();
      const buf=await decode(key,b64);if(tok!==playToken)return;
      await new Promise(res=>{const src=actx.createBufferSource();src.buffer=buf;src.playbackRate.value=pr;src.connect(actx.destination);src.onended=res;curSrc=src;src.start(0);setTimeout(res,buf.duration/pr*1000+400)});
      return;
    }catch(_){}
  }
  await new Promise(res=>{try{const el=new Audio(b64.startsWith('data:')?b64:'data:audio/mpeg;base64,'+b64);el.playbackRate=pr;curEl=el;el.onended=res;el.onerror=res;const pp=el.play();if(pp&&pp.catch)pp.catch(res);setTimeout(res,8000)}catch(_){res()}});
}
const hasDeviceVoice=()=>{try{return 'speechSynthesis' in window&&voices.length>0}catch(_){return false}};

/* parts: [{k:clave de audio, t:texto, data:audio propio}] */
async function talk(parts,opt={}){
  if(!opt.keep)stopAll();const tok=playToken;unlockAudio();
  const st=P()?.settings||{};const mode=st.voz||'grabada';
  if(mode==='dispositivo'&&hasDeviceVoice()&&!parts.some(p=>p.data)){await speak(parts.map(p=>p.t).join(' '),opt);return}
  const userRate=(opt.rate||st.rate||.9)/.9;
  for(let i=0;i<parts.length;i++){
    if(tok!==playToken)return;const p=parts[i];const data=p.data||AUD[p.k];
    if(data){await playB64(p.data?('r:'+p.k):p.k,data,opt.raw?1:userRate,tok)}
    else{
      // armar la frase con palabras grabadas, si todas existen
      const ids=p.t.split(/\s+/).map(x=>wordIdx()[norm(x).replace(/_/g,'')]||wordIdx()[norm(x)]);
      if(ids.length&&ids.every(id=>id&&AUD['w:'+id])){for(let j=0;j<ids.length;j++){if(tok!==playToken)return;await playB64('w:'+ids[j],AUD['w:'+ids[j]],userRate,tok);await wait(90)}}
      else if('speechSynthesis' in window){await speak(p.t,opt)}
    }
    if(i<parts.length-1)await wait(opt.gap!=null?opt.gap:120);
  }
}

/* ============ SÍLABAS ============ */
const STRONG='aeoáéó',ACCW='íú',INSEP=['pr','br','tr','dr','cr','gr','fr','pl','bl','cl','gl','fl','kr','kl','tl'];
const isV=c=>c.length===1&&'aeiouáéíóúü'.includes(c);
function syl1(w){
  const s=w.toLowerCase();const u=[];
  for(let i=0;i<s.length;i++){const two=s.substr(i,2);
    if(['ch','ll','rr'].includes(two)){u.push(two);i++;continue}
    if((two==='qu'||two==='gu')&&'eéií'.includes(s[i+2]||'')){u.push(two);i++;continue}
    u.push(s[i])}
  const segs=[];for(const x of u){const t=isV(x)?'V':'C';if(segs.length&&segs[segs.length-1].t===t)segs[segs.length-1].a.push(x);else segs.push({t,a:[x]})}
  const parts=[];
  for(const g of segs){if(g.t==='C'){parts.push(g);continue}
    let nuc=[g.a[0]];
    for(let k=1;k<g.a.length;k++){const p=g.a[k-1],c=g.a[k];
      const hi=(STRONG.includes(p)&&STRONG.includes(c))||(ACCW.includes(c))||(ACCW.includes(p))||p===c;
      if(hi){parts.push({t:'V',s:nuc.join('')});parts.push({t:'C',a:[]});nuc=[c]}else nuc.push(c)}
    parts.push({t:'V',s:nuc.join('')})}
  const out=[];let onset='',i=0;
  if(parts[0]&&parts[0].t==='C'){onset=parts[0].a.join('');i=1}
  for(;i<parts.length;i++){const p=parts[i];
    if(p.t==='V'){out.push(onset+p.s);onset='';continue}
    const a=p.a;if(i===parts.length-1){if(out.length)out[out.length-1]+=a.join('');else onset+=a.join('');continue}
    let coda=[],ons=[];const n=a.length;
    if(n===1)ons=a;else if(n>1){if(INSEP.includes(a.slice(-2).join(''))){coda=a.slice(0,n-2);ons=a.slice(-2)}else{coda=a.slice(0,n-1);ons=a.slice(-1)}}
    if(out.length)out[out.length-1]+=coda.join('');onset=ons.join('')}
  return out.length?out:[w];
}
const silabas=t=>t.replace(/[¡!¿?.,]/g,'').trim().split(/\s+/).map(syl1);

/* Tamaño de pictograma según la pantalla: celular, tablet, iPad, computadora */
function tileSize(L,st){
  const vw=window.innerWidth,vh=window.innerHeight;
  const side=vw>=900&&vh>=520?116:0;               // menú lateral
  const avail=Math.max(260,Math.min(vw-side-24,1500));
  const short=Math.min(vw,vh);
  // factor: celular ~0.72, tablet ~1, pantalla grande hasta 1.35
  let f=short<480?0.72:short<700?0.86:short<1000?1:1.15;
  if(vw>1600)f=1.3;
  if(vh<520&&vw>vh)f=Math.min(f,0.72);               // celular horizontal
  let px=Math.round(L.tile[0]*f+(st.big?26*f:0));
  // al menos 2 columnas y que quepa bien en pantallas angostas
  px=Math.min(px,Math.floor((avail-12)/2));
  return Math.max(84,px);
}

  if(!G.game){

    $('#main').innerHTML=`<div class="panel"><h2>🎮 Juegos</h2><p class="sub">Juegos cortos para trabajar comprensión, categorías y atención con el vocabulario de ${esc(p.name)}. Se adaptan a su nivel (${nOpts()} opciones por ronda).</p></div>
    <div class="games">${GAMES.map(g=>{const st=gstat(g.id);const dis=pool.length<4||(g.id==='grupo'&&groupCats().length<2);return`<button class="gcard" data-g="${g.id}" ${dis?'disabled':''}><span class="ge">${g.e}</span><b>${g.name}</b><small class="area">${g.area}</small><small>${g.desc}</small><small class="gst">${dis?'Activa más palabras en Ajustes para este juego':st.n?`Jugado ${st.n} ${st.n===1?'vez':'veces'}`+(g.id!=='memo'&&st.a?` · ${Math.round(st.s/st.a*100)}% al primer intento`:''):'¡Nuevo!'}</small></button>`}).join('')}</div>`;
    $('#main').onclick=e=>{const b=e.target.closest('.gcard');if(b&&!b.disabled){G={game:b.dataset.g,round:0,ok:0,total:8};gstat(G.game).n++;save();newRound();}};
    return;
  }
  if(G.game==='memo')return rMemo();
  rChoice();
}
function groupCats(){const pool=gamePool();return Object.keys(GROUP_Q).filter(c=>pool.some(w=>w.c===c)&&pool.filter(w=>w.c!==c).length>=2)}
function newRound(){
  const pool=gamePool();G.errors=0;G.done=false;
  if(G.game==='memo'){const n=[2,3,4,6,8][P().level-1];const ws=[];for(const w of shuffle(pool.slice())){if(ws.length>=n)break;if(!ws.some(o=>clash(o,w)))ws.push(w)}G.cards=shuffle(ws.concat(ws).map((w,i)=>({id:w.id,k:i,open:false,done:false})));G.moves=0;G.sel=[];render();return}
  if(G.round>=G.total){render();return}
  if(G.game==='toca'){
    let t;let tries=0;do{t=rnd(pool);tries++}while(G.last===t.id&&tries<6);G.last=t.id;
    G.target=t;G.opts=pickOpts(t,pool,nOpts());G.prompt=[wordPart(t)];G.ptext='Escucha y toca';
  }else{
    const cats=groupCats();let c=rnd(cats);if(cats.length>1&&c===G.lastCat)c=rnd(cats.filter(x=>x!==c));G.lastCat=c;
    const inC=pool.filter(w=>w.c===c),out=pool.filter(w=>w.c!==c);const t=rnd(inC);
    const opts=[t];for(const w of shuffle(out.slice())){if(opts.length>=nOpts())break;if(!opts.some(o=>o.c===w.c&&opts.length<3&&false)&&!opts.some(o=>clash(o,w)))opts.push(w)}
    G.target=t;G.opts=shuffle(opts);const q=GROUP_Q[c][0];G.prompt=[{k:'f:g_'+c,t:q}];G.ptext=q;
  }
  render();setTimeout(()=>talk(G.prompt),300);
}
function rChoice(){
  const p=P(),gm=GAMES.find(g=>g.id===G.game);
  if(G.round>=G.total){return endScreen(`${G.ok} de ${G.total} al primer intento`,G.ok/G.total)}
  $('#main').innerHTML=`<div class="${p.settings.fitz?'fitz':''} ${p.settings.upper?'upper':''}">
   <div class="gbar"><button class="btn ghost small" id="gExit">← Juegos</button><b>${gm.e} ${gm.name}</b><span class="dots">${Array.from({length:G.total},(_,i)=>`<i class="${i<G.round?'d':''} ${i===G.round?'c':''}"></i>`).join('')}</span></div>
   <div class="prompt"><button class="btn" id="gSay">🔊</button><span>${esc(G.ptext)}</span></div>
   <div class="grid nolbl gopts ${G.opts.length<=3?'few':''}" id="gopts">${G.opts.map(w=>tile(w)).join('')}</div>
   <p class="note" style="text-align:center">Si se equivoca dos veces, se ilumina la respuesta para que aprenda sin frustrarse.</p></div>`;
  $('#main').onclick=async e=>{
    if(e.target.closest('#gExit')){G={game:null};stopAll();render();return}
    if(e.target.closest('#gSay')){talk(G.prompt);return}
    const t=e.target.closest('#gopts .tile');if(!t||G.done)return;
    const w=W(t.dataset.id);const ok=w.id===G.target.id;
    if(ok){
      G.done=true;t.classList.add('right');const st=gstat(G.game);st.a++;if(!G.errors){st.s++;G.ok++}
      if(G.game==='toca'){p.rstats=p.rstats||{};const r=p.rstats[w.id]||(p.rstats[w.id]={a:0,s:0});r.a++;if(!G.errors)r.s++}
      logUse('g');burst();const pi=Math.floor(Math.random()*PRAISE.length);
      await talk([wordPart(w),{k:'f:praise'+pi,t:PRAISE[pi]}],{gap:250});G.round++;setTimeout(newRound,350);
    }else{
      G.errors++;t.classList.add('wrong');setTimeout(()=>t.classList.remove('wrong'),600);
      if(G.game==='toca'&&p.rstats){}
      await talk([{k:'f:intenta',t:'Intenta otra vez'}].concat(G.prompt),{gap:250});
      if(G.errors>=2){const c=document.querySelector(`#gopts .tile[data-id="${G.target.id}"]`);c&&c.classList.add('hint')}
    }
  };
}
function rMemo(){
  const p=P();
  if(G.cards.every(c=>c.done)){return endScreen(`${G.cards.length/2} parejas en ${G.moves} intentos`,Math.min(1,(G.cards.length/2)/Math.max(1,G.moves)*1.5))}
  $('#main').innerHTML=`<div class="${p.settings.upper?'upper':''}"><div class="gbar"><button class="btn ghost small" id="gExit">← Juegos</button><b>🃏 Memoria</b><span class="score">Intentos: ${G.moves}</span></div>
  <div class="grid memo nolbl ${p.settings.fitz?'fitz':''}" id="mgrid">${G.cards.map((c,i)=>{const w=W(c.id);return c.open||c.done?`<button class="tile t-${w.t} ${c.done?'right':''}" data-i="${i}">${pic(w)}<span class="lbl">${esc(w.w)}</span></button>`:`<button class="tile back" data-i="${i}"><span class="pic">⭐</span></button>`}).join('')}</div></div>`;
  $('#main').onclick=async e=>{
    if(e.target.closest('#gExit')){G={game:null};stopAll();render();return}
    const b=e.target.closest('#mgrid .tile');if(!b||G.busy)return;const c=G.cards[+b.dataset.i];if(c.open||c.done)return;
    c.open=true;G.sel.push(c);rMemo();sayWord(W(c.id));
    if(G.sel.length===2){G.moves++;G.busy=true;const[a,b2]=G.sel;
      if(a.id===b2.id){a.done=b2.done=true;G.sel=[];logUse('g');await wait(700);await talk([{k:'f:pareja',t:'¡Encontraste la pareja!'}]);G.busy=false;
        if(G.cards.every(x=>x.done)){const st=gstat('memo');st.best=st.best?Math.min(st.best,G.moves):G.moves;save();burst();await talk([{k:'f:ganaste',t:'¡Ganaste! ¡Muy bien!'}])}
        rMemo()}
      else{await wait(1100);a.open=b2.open=false;G.sel=[];G.busy=false;rMemo()}}
  };
}
function endScreen(txt,ratio){
  const stars=ratio>=.85?3:ratio>=.5?2:1;save();
  $('#main').innerHTML=`<div class="panel prac"><div style="font-size:64px">${'⭐'.repeat(stars)}</div><div class="bigword" style="font-size:34px">¡Terminaste!</div><p class="sub" style="font-size:17px">${txt}</p>

}

function reportData(p){
  const days=p.days||{};const dk=Object.keys(days).sort();
  const last30=dk.filter(d=>(Date.now()-new Date(d+'T12:00:00'))<=30*864e5);
  const sum=(arr,k)=>arr.reduce((a,d)=>a+(days[d][k]||0),0);
  const stats=Object.entries(p.stats||{}).map(([id,s])=>({w:W(id),...s})).filter(x=>x.w);
  const mastered=stats.filter(x=>x.s>=3&&x.s/x.a>=.8);
  const progress=stats.filter(x=>!mastered.includes(x)).sort((a,b)=>b.s/b.a-a.s/a.a);
  const top=Object.entries(p.use||{}).map(([id,n])=>({w:W(id),n})).filter(x=>x.w).sort((a,b)=>b.n-a.n).slice(0,10);
  const rs=Object.entries(p.rstats||{}).map(([id,s])=>({w:W(id),...s})).filter(x=>x.w);
  const g=p.games||{};
  return{dk,last30,taps:sum(last30,'t'),frases:sum(last30,'f'),prac:sum(last30,'p'),games:sum(last30,'g'),stats,mastered,progress,top,rs,g};
}
function suggestions(p,d){
  const out=[];const L=LEVELS[p.level-1];
  if(d.last30.length<4)out.push('Usar el tablero varias veces al día en momentos reales (comida, juego, baño), no solo en la sesión de terapia. La constancia es lo que más ayuda.');
  if(d.mastered.length>=8&&p.level<5)out.push(`Domina ${d.mastered.length} palabras. Considerar pasar al nivel ${p.level+1} (“${LEVELS[p.level].name}”) para ampliar el vocabulario.`);
  if(p.level>=3&&d.taps>20&&d.frases<3)out.push('Usa palabras sueltas pero casi no arma frases: modelar en el tablero frases de 2 palabras (“quiero + agua”) cada vez que pida algo.');
  const weak=d.progress.filter(x=>x.a>=3&&x.s/x.a<.4).slice(0,5);
  if(weak.length)out.push('Reforzar en Practicar, con apoyo por sílabas: '+weak.map(x=>x.w.w).join(', ')+'.');
  const t=d.g.toca;if(t&&t.a>=8){const r=t.s/t.a;out.push(r>=.8?'Muy buena comprensión de palabras en el juego “Toca la palabra”: se pueden agregar más opciones o palabras nuevas.':r<.5?'La comprensión de palabras aún está en desarrollo: practicar “Toca la palabra” con pocas opciones y nombrar los objetos reales a diario.':'Comprensión de palabras en buen avance; continuar con los juegos de forma breve y frecuente.')}
  (p.conds||[]).forEach(k=>CONDS[k]&&out.push(CONDS[k].tip));
  if(!out.length)out.push(`Continuar trabajando el objetivo del nivel ${p.level}: ${L.desc}`);
  return out;
}

/* ============ GRABAR VOZ PROPIA ============ */
let newRec=null,mediaRec=null,recTimer=null;
async function recToggle(){
  const b=$('#nRec'),msg=$('#nRecMsg');
  if(mediaRec&&mediaRec.state==='recording'){mediaRec.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Este navegador no permite grabar; usa “Subir audio”');return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const chunks=[];mediaRec=new MediaRecorder(stream);
    mediaRec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
    mediaRec.onstop=()=>{clearTimeout(recTimer);stream.getTracks().forEach(t=>t.stop());
      const blob=new Blob(chunks,{type:mediaRec.mimeType||'audio/webm'});const r=new FileReader();
      r.onload=()=>{newRec=r.result;b.textContent='🎙️ Grabar de nuevo';$('#nPlay').classList.remove('hidden');msg.textContent='Grabación lista ✓';talk([{k:'tmp'+Date.now(),t:'',data:newRec}])};r.readAsDataURL(blob)};
    mediaRec.start();b.textContent='⏹️ Detener';msg.textContent='Grabando… di la palabra';
    recTimer=setTimeout(()=>{if(mediaRec.state==='recording')mediaRec.stop()},4000);
  }catch(_){toast('No se pudo usar el micrófono; usa “Subir audio”')}
}

/* ============ MODO NIÑO (bloqueo) ============ */
(function(){
  const b=$('#lockBtn'),ring=$('#lockRing');let t,start;
  const set=()=>{$('#lockIc').textContent=locked?'🔒':'🔓';b.title=locked?'Mantén presionado 2 s para desbloquear':'Modo niño: oculta Ajustes'};
  b.onclick=()=>{if(!locked){locked=true;if(view==='ajustes')view='hablar';set();render();toast('Modo niño activo · mantén 🔒 2 s para salir')}};
  b.onpointerdown=()=>{if(!locked)return;start=Date.now();ring.style.transition='transform 2s linear';ring.style.transform='scaleX(1)';t=setTimeout(()=>{locked=false;set();render();toast('Ajustes desbloqueados')},2000)};
  const cancel=()=>{clearTimeout(t);ring.style.transition='none';ring.style.transform='scaleX(0)'};
  b.onpointerup=b.onpointerleave=b.onpointercancel=cancel;
  set();
})();
let rsT;const onResize=()=>{clearTimeout(rsT);rsT=setTimeout(()=>{if(P())applyLook()},120)};
window.addEventListener('resize',onResize);
/* Agregar el vocabulario nuevo a perfiles existentes */
S.profiles.forEach(p=>{if((p.vocabV||1)<VOCAB_V){const rec=recommend(p);BASE.filter(w=>w.v===2&&rec.includes(w.id)&&!p.enabled.includes(w.id)).forEach(w=>p.enabled.push(w.id));p.vocabV=VOCAB_V}});save();window.addEventListener('orientationchange',onResize);
try{screen.orientation&&screen.orientation.addEventListener('change',onResize)}catch(_){}
/* Evitar menú contextual / lupa al mantener presionado en tablets y celulares */
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tile,.chip,.step,#lockBtn,#sBack,.bigpic'))e.preventDefault()});
/* Evitar zoom con doble toque en iOS antiguos */
let lastTouch=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-lastTouch<350&&e.target.closest('.tile,.sbtn,.chip'))e.preventDefault();lastTouch=n},{passive:false});
/* Pantalla completa (tablets, computadoras y Android; iPhone no lo permite) */
(function(){const b=$('#fsBtn');const d=document.documentElement;
  const req=d.requestFullscreen||d.webkitRequestFullscreen;const ex=document.exitFullscreen||document.webkitExitFullscreen;
  if(!req||/iPhone|iPod/.test(navigator.userAgent))return;b.classList.remove('hidden');
  b.onclick=()=>{try{const fs=document.fullscreenElement||document.webkitFullscreenElement;const r=fs?ex.call(document):req.call(d);if(r&&r.catch)r.catch(()=>toast('Este navegador no permite pantalla completa aquí'))}catch(_){toast('Este navegador no permite pantalla completa aquí')}};
})();
/* Desbloquear la voz en iOS/Safari con el primer toque */
document.addEventListener('pointerdown',unlockAudio,{capture:true});document.addEventListener('keydown',unlockAudio,{capture:true});
let voiceUnlocked=false;document.addEventListener('pointerdown',()=>{if(voiceUnlocked)return;voiceUnlocked=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(_){}} ,{once:true,capture:true});
/* Teclado: flechas para moverse entre pictogramas en computadora */
document.addEventListener('keydown',e=>{const t=document.activeElement;if(!t||!t.classList||!t.classList.contains('tile'))return;
  const g=t.parentElement;const items=[...g.querySelectorAll('.tile')];const i=items.indexOf(t);
  const cols=Math.max(1,Math.round(g.clientWidth/t.offsetWidth));
  const m={ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[e.key];if(m){const n=items[i+m];if(n){n.focus();e.preventDefault()}}});
render();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))}
